spring:
  application:
    name: DoQuest-server
  profiles:
    default: local
  config:
    import:
      - optional:classpath:application-secret.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

ai:
  retry:
    max-attempts: 3
    initial-backoff-ms: 500
    backoff-multiplier: 2.0
  service:
    base-url: http://localhost:8000
    connect-timeout-ms: 3000
    read-timeout-ms: 60000 # LLM I/O 지연 대비 타임아웃 60초 설정
